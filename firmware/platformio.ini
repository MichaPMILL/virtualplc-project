; VirtualPLC firmware with PlatformIO (alternative to the Arduino IDE / arduino-cli).
;   pio run -e esp32dev -t upload
; The portable CPU core (../runtime/core) is compiled with the sketch.
[platformio]
src_dir = VirtualPLC

[env]
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> +<../../runtime/core/*.cpp>
build_flags = -I../runtime/core -std=gnu++17
build_unflags = -std=gnu++11 -std=gnu++14

[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs

[env:pico-w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m

[env:uno-r4-wifi]
platform = renesas-ra
board = uno_r4_wifi

[env:due]
platform = atmelsam
board = due
