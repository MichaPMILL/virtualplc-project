name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, json, pcntl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: find src public tests bin -type f \( -name '*.php' -o -name virtualplc \) -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        run: vendor/bin/phpunit

      - name: Check example program
        run: bin/virtualplc check examples/project.scl && bin/virtualplc compile examples/project.json > /dev/null
