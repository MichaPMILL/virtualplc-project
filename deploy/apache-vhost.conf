# Example Apache vhost: only public/ is exposed; project/status files stay outside the web root.
<VirtualHost *:80>
    ServerName plc.example.local
    DocumentRoot /opt/virtualplc/public

    SetEnv VPLC_DATA_DIR /opt/virtualplc/var
    # Generate with: openssl rand -hex 32
    SetEnv VPLC_API_TOKEN change-me

    <Directory /opt/virtualplc/public>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    # Pass the Authorization header to PHP (needed with some PHP handlers)
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
</VirtualHost>
